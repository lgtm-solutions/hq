services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hq}
      POSTGRES_DB: ${POSTGRES_DB:-hq}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
